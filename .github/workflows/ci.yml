name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes an in-flight run on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, tests and bundle
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The repository's .npmrc sets legacy-peer-deps, because Expo 57 pulls
      # react-native-reanimated 4.5.1 which peers on react-native-worklets
      # 0.10.x, and npm's strict resolution refuses the tree. The flag is kept
      # here as well so this step still works if the file is ever dropped.
      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test -- --ci

      # Bundling catches a missing or unresolvable import, which typecheck does
      # not: Metro resolves for real. It does NOT catch a native dependency
      # conflict — this step passed for weeks on a tree Gradle refused to
      # build, because it produces JavaScript and never opens the Android
      # project. The apk job below is what checks that.
      # The moment of this build, in the shape Settings prints. Its own step
      # so it is one value for the whole job.
      - name: Stamp the build
        run: echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      # The same three variables the APK build sets, so what this bundles is
      # what ships. The apk job explains each one.
      - name: Bundle for Android
        env:
          EXPO_PUBLIC_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPO_PUBLIC_BUILD_TIME: ${{ env.BUILD_TIME }}
          EXPO_PUBLIC_UPDATES_REPO: ${{ vars.RELEASES_REPO || github.repository }}
        run: npx expo export --platform android --output-dir dist

  # ---------------------------------------------------------------- web build
  #
  # The APK cannot be installed on an iPhone, and the App Store needs an Apple
  # developer account and a review. The same app also builds for the browser,
  # which is a link anybody can open and add to their home screen — and the one
  # way to put it in front of an iPhone today.
  #
  # What a browser cannot do, and the app says so where it matters: the phone's
  # hardware keystore (keys are held in ordinary browser storage instead),
  # background sync while the tab is closed, the camera roll and the mail app.
  # Everything else — the sites, the jobs, the forms, the calculators, the
  # standards library, the map — works, and the database is the browser's own,
  # so what a person enters stays on their device.
  web:
    name: Web app
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Stamp the build
        run: echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      # A GitHub project page is served from /<repo>/, not from the root of the
      # domain, and the export writes its asset paths from the root — so on a
      # project page every one of them is a 404 and the page is blank. Expo
      # takes the prefix from app.json rather than a flag, so it is written in
      # before the export when WEB_BASE_URL says the app will live under a
      # path. Netlify, Cloudflare and a <name>.github.io repository all serve
      # at the root, and there the variable is left unset.
      - name: Point the build at where it will be served
        if: vars.WEB_BASE_URL != ''
        run: |
          node -e '
            const fs = require("fs");
            const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
            app.expo.experiments = { ...app.expo.experiments, baseUrl: process.env.BASE };
            fs.writeFileSync("app.json", JSON.stringify(app, null, 2) + "\n");
            console.log("baseUrl set to " + process.env.BASE);
          '
        env:
          BASE: ${{ vars.WEB_BASE_URL }}

      - name: Export for the web
        env:
          EXPO_PUBLIC_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPO_PUBLIC_BUILD_TIME: ${{ env.BUILD_TIME }}
          EXPO_PUBLIC_UPDATES_REPO: ${{ vars.RELEASES_REPO || github.repository }}
        run: npx expo export --platform web --output-dir web-build

      # Adds the head tags that make it an app on an iPhone home screen rather
      # than a browser tab, and writes 404.html — a static host has no router,
      # so a deep link like /work/timesheets is a miss, and the 404 page is
      # what hands the path to the app's own router.
      - name: Finish the web shell
        run: node scripts/webShell.js web-build

      - uses: actions/upload-artifact@v4
        with:
          name: web-app
          path: web-build
          retention-days: 14

      # This repository is private, so a page served from it would ask everyone
      # for a GitHub login. The built app — JavaScript and assets, no source —
      # is pushed to a public repository whose only job is to serve it.
      #
      # Two things to do once, by hand:
      #   1. Create a public repository for it, e.g.
      #      lochiehayes13-bit/safe-qld-app, and turn on Pages
      #      (Settings -> Pages -> Deploy from a branch -> main / root).
      #   2. Here (Settings -> Secrets and variables -> Actions) add a variable
      #      WEB_REPO holding that name. The RELEASES_TOKEN secret the APK
      #      mirror uses is reused, so its fine-grained token needs Contents:
      #      read and write on that repository too.
      #   3. A project page is served from /<repo>/, so add WEB_BASE_URL
      #      holding that same path with slashes either side, e.g.
      #      /safe-qld-app/. Leave it unset for anything served at the root of
      #      a domain.
      #
      # Until both are set this step says so and exits clean; the build above
      # is still downloadable from the run.
      - name: Publish to the public web repository
        env:
          WEB_REPO: ${{ vars.WEB_REPO }}
          TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$WEB_REPO" ] || [ -z "$TOKEN" ]; then
            echo "skipped: WEB_REPO and RELEASES_TOKEN are not both set"
            exit 0
          fi
          cd web-build
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Safe QLD web app from ${{ github.event.pull_request.head.sha || github.sha }}"
          # Force, because this repository holds one thing: the current build.
          # Its history is of no use to anybody and a year of 11 MB bundles is.
          git push -q --force "https://x-access-token:$TOKEN@github.com/$WEB_REPO.git" HEAD:main
          echo "published to https://$(echo "$WEB_REPO" | cut -d/ -f1).github.io/$(echo "$WEB_REPO" | cut -d/ -f2)/"

  apk:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Needed to publish the release the APK is attached to. Scoped to this job
    # rather than the workflow, so the typecheck job keeps a read-only token.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Gradle needs a JDK; the Android SDK is already on the runner image.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install
        run: npm ci --legacy-peer-deps

      # The android/ directory is generated and not in version control, so it
      # is produced here the same way it is locally.
      - name: Generate the native project
        run: npx expo prebuild --platform android --no-install

      - uses: gradle/actions/setup-gradle@v4

      # The build that actually proves this ships. Reanimated asserts its own
      # worklets version in a Gradle task, and nothing before this point in the
      # pipeline runs it — typecheck reads types, the tests are pure logic, and
      # the bundle above is JavaScript. All three passed on a tree where this
      # failed outright.
      #
      # arm64 only: it is every handset from roughly 2017 on, and it halves the
      # build. Drop the -P flag for a universal APK that also covers 32-bit and
      # emulator images.
      - name: Stamp the build
        run: echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      # The build's own identity, so a phone can say which build it is
      # running and whether the release is newer. Metro inlines every
      # `process.env.EXPO_PUBLIC_*` read at bundle time, and the release
      # bundle is produced inside this Gradle run, so the variables are set on
      # this step rather than on the prebuild above, which only generates the
      # project. The head sha on a pull request, because that is the commit
      # whose code this is; github.sha there is a merge commit that exists
      # nowhere else. UPDATES_REPO is where the phone looks for releases: the
      # public mirror when one is configured, otherwise this repository.
      - name: Build the release APK
        working-directory: android
        env:
          EXPO_PUBLIC_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPO_PUBLIC_BUILD_TIME: ${{ env.BUILD_TIME }}
          EXPO_PUBLIC_UPDATES_REPO: ${{ vars.RELEASES_REPO || github.repository }}
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a

      # Signed with the standard Android debug key, which prebuild configures:
      # installable by sideload, not accepted by the Play Store. RUNNING.md
      # covers the Play route.
      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: safe-qld-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      # A build artifact is the wrong shape for the person who has to install
      # it. It only exists inside the Actions UI, it downloads as a zip, and a
      # phone browser handles neither well — the file arrives as an archive
      # Android will not open, if it arrives at all.
      #
      # A release asset is a plain file on a plain URL. The link below ends in
      # .apk, so a phone downloads it and offers to install it directly. The
      # repository is private, so it still needs a GitHub login — but that is
      # one login rather than a zip to unpack on a handset.
      #
      # One rolling tag rather than a version per build: the useful link is
      # "the current one", and it has to stay the same link so it can be
      # bookmarked. Older builds remain available as run artifacts.
      - name: Name the APK after the app rather than the task that built it
        run: cp android/app/build/outputs/apk/release/app-release.apk safe-qld.apk

      - name: Publish it as a downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Safe QLD — latest Android build
          body: |
            Sideload build of the Safe QLD field app, rebuilt on every push.

            **[Download safe-qld.apk](https://github.com/${{ github.repository }}/releases/download/android-latest/safe-qld.apk)** —
            open this on the phone, tap the file when it finishes, and allow
            installing from that source when asked. It appears as **Safe QLD**.

            Built from `${{ github.sha }}`.

            Signed with the standard Android debug key: fine to sideload, not
            accepted by the Play Store.
          files: safe-qld.apk
          # Marked as a prerelease so it never looks like a published version of
          # the product, and updated in place so the download link never moves.
          prerelease: true
          make_latest: false

      # The step above only writes the body the first time the release is
      # created; on every later run it replaces the file and leaves the text
      # alone, so "Built from" was pointing at the first build for good. The
      # commit line is the only way to tell which build the link serves, so it
      # is rewritten here on every run.
      - name: Say which commit the download now serves
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          Sideload build of the Safe QLD field app, rebuilt on every push.

          **[Download safe-qld.apk](https://github.com/${{ github.repository }}/releases/download/android-latest/safe-qld.apk)** —
          open this on the phone, tap the file when it finishes, and allow
          installing from that source when asked. It appears as **Safe QLD**.

          Built from `${{ github.event.pull_request.head.sha || github.sha }}` on ${{ github.head_ref || github.ref_name }}.

          Signed with the standard Android debug key: fine to sideload, not
          accepted by the Play Store.
          NOTES
          gh release edit android-latest --repo "${{ github.repository }}" --notes-file notes.md

      # The release above sits on a private repository, so its download link
      # lands on a GitHub login page, and the technicians who install the app
      # do not have a GitHub login. The same file is copied to a public
      # repository that holds nothing but releases, and the APK is built
      # pointing at that one (EXPO_PUBLIC_UPDATES_REPO, above), so "Download
      # and install" on the phone opens a plain file.
      #
      # Two things to do once, by hand:
      #   1. Create a public repository for the mirror, e.g.
      #      lochiehayes13-bit/safe-qld-releases, with a README so it has a
      #      commit for the tag to sit on. No code goes in it.
      #   2. On this repository (Settings → Secrets and variables → Actions),
      #      add a variable RELEASES_REPO holding that name, and a secret
      #      RELEASES_TOKEN: a fine-grained personal access token scoped to
      #      the mirror repository only, with Contents: read and write.
      #
      # Until both are set the step says so and exits clean, and the release
      # above is the only copy. The notes are rewritten to point at the
      # mirror, since the download link in them names the repository.
      - name: Mirror to the public releases repository
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          RELEASES_REPO: ${{ vars.RELEASES_REPO }}
        run: |
          if [ -z "$RELEASES_REPO" ] || [ -z "$GH_TOKEN" ]; then
            echo "skipped: RELEASES_REPO and RELEASES_TOKEN are not both set"
            exit 0
          fi
          sed "s#github.com/${{ github.repository }}/#github.com/$RELEASES_REPO/#g" notes.md > mirror-notes.md
          gh release create android-latest --repo "$RELEASES_REPO" --prerelease \
            --title "Safe QLD — latest Android build" --notes-file mirror-notes.md || true
          gh release upload android-latest safe-qld.apk --repo "$RELEASES_REPO" --clobber
          gh release edit android-latest --repo "$RELEASES_REPO" --notes-file mirror-notes.md
