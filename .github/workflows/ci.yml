name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes an in-flight run on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, tests and bundle
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The repository's .npmrc sets legacy-peer-deps, because Expo 57 pulls
      # react-native-reanimated 4.5.1 which peers on react-native-worklets
      # 0.10.x, and npm's strict resolution refuses the tree. The flag is kept
      # here as well so this step still works if the file is ever dropped.
      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test -- --ci

      # Bundling is the check that catches what typecheck cannot: a missing
      # native peer dependency compiles fine and then fails to start.
      - name: Bundle for Android
        run: npx expo export --platform android --output-dir dist
